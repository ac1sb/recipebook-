# Cloudflare Workers settings for The Borsari Kitchen.
# Setup steps are in the README ("Publish on Cloudflare").
name = "borsari-kitchen"
main = "worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
# Send every request through the Worker first, so the optional password also protects the pages.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "borsari-kitchen"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "borsari-kitchen-images"

[observability]
enabled = true
